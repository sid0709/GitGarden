id: go-systems
name: Go Systems
language: go
commit_style: terse
timezone: America/New_York
working_hours: [8, 17]
weekend_weight: 0.08
vacation_gaps: []
branch_patterns:
  - feat/{slug}
  - fix/{slug}
messages:
  - "{slug}: handle shutdown"
  - "{slug}: tighten timeouts"
  - "tests for {slug} retry"
issue_titles:
  - "{slug} leaks goroutines on cancel"
