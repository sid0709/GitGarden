  - "{slug}: bounded worker pool"
pr_bodies:
  - "Fixes #{issue} by bounding {slug} workers."
review_comments:
  - "Need a test with a canceled context."
bio: "Go, queues, and mildly obsessive tracing."
slugs: [worker, gateway, ingest, replica, lease]
